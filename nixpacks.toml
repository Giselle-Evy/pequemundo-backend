[phases.setup]
nixPkgs = ["php81Packages.composer", "php81Extensions.bcmath", "php81Extensions.pdo_mysql", "php81Extensions.sodium", "php81Extensions.mbstring", "php81Extensions.xml", "php81Extensions.curl", "php81Extensions.gd", "php81Extensions.zip"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
    "php artisan config:clear",
    "php artisan route:clear",
    "php artisan view:clear"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"